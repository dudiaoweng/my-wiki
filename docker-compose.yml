services:
  my-wiki:
    image: my-wiki
    build: .
    container_name: my-wiki
    ports:
      - "8000:8000"   # 登录页（HTTPS，无需客户端证书）
    volumes:
      - ./data:/app/data          # SQLite 数据库持久化（本机 data 目录）
      - ./uploads:/app/uploads    # 上传文件持久化（本机 uploads 目录）
      # 证书目录只读挂载（镜像内不含证书，启动必须提供）
      - ./certs:/certs:ro
    environment:
      # ─── 基础设施（容器内路径）───
      - DATABASE_URL=sqlite:////app/data/knowledge_base.db
      - UPLOAD_DIR=/app/uploads
      # ─── LLM 文本模型 ───
      - LLM_API_KEY=***REMOVED***
      - LLM_API_BASE=https://open.bigmodel.cn/api/paas/v4
      - LLM_MODEL=GLM-5.2
      # ─── 视觉模型 ───
      - VISION_API_KEY=***REMOVED***
      - VISION_API_BASE=https://open.bigmodel.cn/api/paas/v4
      - VISION_MODEL=GLM-5V-Turbo
      # ─── 语音识别模型 ───
      - ASR_API_KEY=***REMOVED***
      - ASR_API_BASE=https://open.bigmodel.cn/api/paas/v4
      - ASR_MODEL=GLM-ASR-2512
      # ─── 嵌入模型 ───
      - EMBEDDING_API_KEY=***REMOVED***
      - EMBEDDING_API_BASE=https://open.bigmodel.cn/api/paas/v4
      - EMBEDDING_MODEL=embedding-3
      # ─── 问答 ───
      - QA_TEMPERATURE=0.2
      # ─── TLS / mTLS ───
      - SSL_CERTFILE=/certs/server.crt
      - SSL_KEYFILE=/certs/server.key
      # 客户端证书信任链（后端保留，备用）
      - SSL_CA_CERTS=/certs/ca.crt
      # ─── mTLS 白名单（留空 = allow-all；非空 = 逗号分隔 subject DN）───
      - ALLOWED_CERT_SUBJECTS=
    restart: unless-stopped

  nginx:
    image: nginx:1.25
    container_name: my-wiki-nginx
    depends_on:
      - my-wiki
    ports:
      - "8443:8443"   # mTLS 应用入口（TLS 终止 + 客户端证书请求不验证）
      - "8080:8080"   # CRL 分发
    volumes:
      - ./nginx/mtls.conf:/etc/nginx/conf.d/mtls.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
