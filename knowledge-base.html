<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — 个人知识库</title>
<style>
/* ============================================
   DESIGN TOKENS — Ink & Paper Study
   ============================================ */
:root {
  --c-page:        #FCFCFA;
  --c-surface:     #F3F1ED;
  --c-sidebar:     #F6F5F1;
  --c-card:        #FFFFFF;
  --c-text:        #1A1C1E;
  --c-text-soft:   #5B5A60;
  --c-text-muted:  #8F8D94;
  --c-accent:      #1E5C8A;
  --c-accent-hover:#164870;
  --c-accent-wash: #E4ECF3;
  --c-border:      #DDDAD4;
  --c-tag-bg:      #F0EBE4;
  --c-tag-text:    #7D5E3C;
  --c-danger:      #B8453A;
  --c-danger-wash: #FAF0EE;
  --c-success:     #3D7B4F;

  --font-display: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', Palatino, Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
  --font-mono:    'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-modal: 0 20px 60px rgba(0,0,0,0.15), 0 8px 20px rgba(0,0,0,0.08);

  --sidebar-w: 260px;
  --transition-fast: 150ms ease;
  --transition-base: 220ms ease;
}

/* ============================================
   RESET & BASE
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  color: var(--c-text);
  background: var(--c-page);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
}

/* Focus ring */
:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--c-sidebar);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform var(--transition-base);
}

.sidebar-brand {
  padding: 24px 24px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-brand .logo {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  background: var(--c-accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}

.sidebar-brand h1 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--c-text);
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
}

.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }

.nav-section { margin-bottom: 20px; }

.nav-section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--c-text-muted);
  padding: 0 8px;
  margin-bottom: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  color: var(--c-text-soft);
  transition: all var(--transition-fast);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font-body);
  position: relative;
}

.nav-item:hover { background: var(--c-surface); color: var(--c-text); }

.nav-item.active {
  background: var(--c-accent-wash);
  color: var(--c-accent);
  font-weight: 500;
}

.nav-item .count {
  margin-left: auto;
  font-size: 12px;
  color: var(--c-text-muted);
  background: var(--c-surface);
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 22px;
  text-align: center;
}

.nav-item.active .count {
  background: var(--c-accent);
  color: white;
}

.nav-item .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Sidebar actions */
.sidebar-actions {
  padding: 12px 16px;
  border-top: 1px solid var(--c-border);
}

.btn-new-article {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px 16px;
  background: var(--c-accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--font-body);
  transition: all var(--transition-fast);
}

.btn-new-article:hover {
  background: var(--c-accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(30, 92, 138, 0.25);
}

.btn-new-article:active { transform: translateY(0); }

.btn-new-article .icon { font-size: 18px; line-height: 1; }

/* ============================================
   MAIN CONTENT AREA
   ============================================ */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---- Top bar ---- */
.topbar {
  display: flex;
  align-items: center;
  padding: 16px 32px;
  gap: 16px;
  border-bottom: 1px solid var(--c-border);
  background: var(--c-card);
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(252, 252, 250, 0.85);
}

.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--c-text-soft);
  padding: 4px;
  line-height: 1;
}

/* ---- Search (Hero when no article selected) ---- */
.search-wrap {
  flex: 1;
  max-width: 640px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--c-text);
  background: var(--c-card);
  transition: all var(--transition-fast);
}

.search-input:focus {
  outline: none;
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px var(--c-accent-wash);
}

.search-input::placeholder { color: var(--c-text-muted); }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--c-text-muted);
  font-size: 16px;
  pointer-events: none;
}

/* ---- Content body ---- */
.content-body {
  flex: 1;
  padding: 32px;
  max-width: 900px;
  width: 100%;
}

/* View switching */
.view { display: none; }
.view.active { display: block; }

/* ============================================
   EMPTY STATE (Hero)
   ============================================ */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 24px 60px;
}

.hero-icon {
  width: 72px; height: 72px;
  border-radius: 20px;
  background: var(--c-accent-wash);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin-bottom: 28px;
}

.hero h2 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  color: var(--c-text);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}

.hero p {
  font-size: 16px;
  color: var(--c-text-soft);
  max-width: 460px;
  line-height: 1.7;
  margin-bottom: 32px;
}

.hero-search {
  width: 100%;
  max-width: 480px;
  position: relative;
}

.hero-search .search-input {
  padding: 14px 20px 14px 48px;
  font-size: 16px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.hero-search .search-icon {
  left: 18px;
  font-size: 18px;
}

/* Quick stats */
.hero-stats {
  display: flex;
  gap: 40px;
  margin-top: 48px;
}

.hero-stat {
  text-align: center;
}

.hero-stat .number {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--c-accent);
}

.hero-stat .label {
  font-size: 13px;
  color: var(--c-text-muted);
  margin-top: 4px;
}

/* ============================================
   ARTICLE LIST
   ============================================ */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.list-header h3 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  color: var(--c-text);
}

.list-header .result-count {
  font-size: 13px;
  color: var(--c-text-muted);
}

.article-list { display: flex; flex-direction: column; gap: 10px; }

.article-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 18px 20px;
  background: var(--c-card);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

/* Color-coded left border — the signature detail */
.article-card::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--card-accent, var(--c-border));
  transition: all var(--transition-fast);
}

.article-card:hover {
  box-shadow: var(--shadow-elevated);
  transform: translateY(-1px);
  border-color: transparent;
}

.article-card:hover::before { top: 0; bottom: 0; border-radius: 0; }

.article-card-body { flex: 1; min-width: 0; }

.article-card-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--c-text);
  margin-bottom: 4px;
  line-height: 1.4;
  letter-spacing: -0.01em;
}

.article-card-excerpt {
  font-size: 13px;
  color: var(--c-text-soft);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.article-card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--c-text-muted);
  flex-wrap: wrap;
}

.article-card-meta .tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--c-tag-bg);
  color: var(--c-tag-text);
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
}

.article-card-category {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 3px;
  white-space: nowrap;
}

/* ============================================
   ARTICLE DETAIL (Reading View)
   ============================================ */
/* Reading progress bar */
.reading-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: var(--c-accent);
  z-index: 200;
  transition: width 80ms linear;
}

.article-detail { animation: fadeSlideIn 280ms ease; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--c-text-soft);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-body);
  padding: 4px 0;
  margin-bottom: 24px;
  transition: color var(--transition-fast);
}

.detail-back:hover { color: var(--c-accent); }

.detail-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--c-border);
}

.detail-category {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}

.detail-title {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
}

.detail-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  color: var(--c-text-muted);
  flex-wrap: wrap;
}

.detail-meta span { display: flex; align-items: center; gap: 5px; }

.detail-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.detail-tags .tag {
  display: inline-block;
  padding: 4px 10px;
  background: var(--c-tag-bg);
  color: var(--c-tag-text);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
}

/* Article body content */
.detail-content {
  font-size: 16px;
  line-height: 1.85;
  color: var(--c-text);
}

.detail-content h1, .detail-content h2, .detail-content h3 {
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--c-text);
  margin: 32px 0 12px;
  letter-spacing: -0.01em;
}

.detail-content h1 { font-size: 28px; }
.detail-content h2 { font-size: 22px; }
.detail-content h3 { font-size: 18px; }

.detail-content p { margin: 0 0 16px; }

.detail-content ul, .detail-content ol {
  margin: 0 0 16px 24px;
}

.detail-content li { margin-bottom: 6px; }

.detail-content code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--c-surface);
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--c-accent);
}

.detail-content pre {
  background: #F5F4F1;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  overflow-x: auto;
  margin: 0 0 20px;
  font-size: 14px;
  line-height: 1.6;
}

.detail-content pre code {
  background: none;
  padding: 0;
  color: var(--c-text);
}

.detail-content blockquote {
  border-left: 3px solid var(--c-accent);
  padding: 8px 20px;
  margin: 0 0 20px;
  color: var(--c-text-soft);
  background: var(--c-accent-wash);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.detail-content a {
  color: var(--c-accent);
  text-decoration: none;
  border-bottom: 1px solid var(--c-accent-wash);
  transition: border-color var(--transition-fast);
}

.detail-content a:hover { border-bottom-color: var(--c-accent); }

.detail-content hr {
  border: none;
  border-top: 1px solid var(--c-border);
  margin: 32px 0;
}

/* Detail actions */
.detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--c-border);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--c-border);
  background: var(--c-card);
  color: var(--c-text);
  font-family: var(--font-body);
  transition: all var(--transition-fast);
}

.btn:hover {
  background: var(--c-surface);
  border-color: var(--c-text-muted);
}

.btn-primary {
  background: var(--c-accent);
  color: white;
  border-color: var(--c-accent);
}

.btn-primary:hover {
  background: var(--c-accent-hover);
  border-color: var(--c-accent-hover);
}

.btn-danger {
  color: var(--c-danger);
  border-color: transparent;
  background: transparent;
}

.btn-danger:hover {
  background: var(--c-danger-wash);
  border-color: var(--c-danger-wash);
}

/* ============================================
   MODAL
   ============================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26, 28, 30, 0.4);
  backdrop-filter: blur(4px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--c-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  width: 100%;
  max-width: 680px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  animation: modalIn 250ms ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--c-border);
}

.modal-header h3 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
}

.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--c-surface);
  cursor: pointer;
  font-size: 18px;
  color: var(--c-text-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.modal-close:hover { background: #e8e5e0; color: var(--c-text); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }

.form-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--c-text-soft);
}

.form-input, .form-select, .form-textarea {
  padding: 10px 14px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--c-text);
  background: var(--c-card);
  transition: all var(--transition-fast);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px var(--c-accent-wash);
}

.form-textarea {
  resize: vertical;
  min-height: 200px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
}

.form-hint {
  font-size: 12px;
  color: var(--c-text-muted);
  line-height: 1.5;
}

.form-hint code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--c-surface);
  padding: 1px 5px;
  border-radius: 2px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px;
  border-top: 1px solid var(--c-border);
}

/* Category color dots in form */
.category-dot-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.category-dot-picker input[type="radio"] { display: none; }

.category-dot-picker label {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.category-dot-picker input[type="radio"]:checked + label {
  border-color: var(--c-text);
  transform: scale(1.15);
}

/* ============================================
   CONFIRMATION DIALOG
   ============================================ */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26, 28, 30, 0.45);
  backdrop-filter: blur(4px);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.confirm-overlay.open { display: flex; }

.confirm-dialog {
  background: var(--c-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  padding: 28px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  animation: modalIn 200ms ease;
}

.confirm-dialog h4 {
  font-family: var(--font-display);
  font-size: 17px;
  margin-bottom: 8px;
}

.confirm-dialog p {
  font-size: 14px;
  color: var(--c-text-soft);
  margin-bottom: 24px;
}

.confirm-dialog .btn-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

/* ============================================
   TOAST
   ============================================ */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--c-text);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;

// ---- State ----
let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        categories: parsed.categories || DEFAULT_CATEGORIES,
        articles: parsed.articles || DEFAULT_ARTICLES,
      };
    }
  } catch (e) { /* corrupted data, fall through */ }
  return {
    categories: [...DEFAULT_CATEGORIES],
    articles: [...DEFAULT_ARTICLES],
  };
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    showToast('存储空间不足，请清理旧数据', 'warning');
    console.warn('Failed to persist to localStorage:', e);
  }
}

// ---- Current view state ----
let currentView = 'hero';    // 'hero' | 'list' | 'detail'
let currentCategory = 'all';
let currentArticleId = null;
let editingArticleId = null; // null = create mode
let searchQuery = '';
let tagFilter = '';
let confirmCallback = null;

/* ============================================
   HELPERS
   ============================================ */
function getCategory(id) {
  return data.categories.find(c => c.id === id);
}

function getCategoryColor(categoryId) {
  const cat = getCategory(categoryId);
  return cat ? cat.color : CATEGORY_COLORS[0];
}

function getArticlesByCategory(categoryId) {
  if (categoryId === 'all') return [...data.articles];
  return data.articles.filter(a => a.categoryId === categoryId);
}

function searchArticles(query, tagFilter) {
  let pool = currentCategory === 'all'
    ? [...data.articles]
    : data.articles.filter(a => a.categoryId === currentCategory);

  if (tagFilter) {
    pool = pool.filter(a => a.tags.some(t => t.toLowerCase() === tagFilter.toLowerCase()));
  }

  if (!query || !query.trim()) return pool;

  const q = query.toLowerCase().trim();
  return pool.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.content.toLowerCase().includes(q) ||
    a.tags.some(t => t.toLowerCase().includes(q))
  );
}

function getAllTags() {
  const set = new Set();
  data.articles.forEach(a => a.tags.forEach(t => set.add(t)));
  return [...set];
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  const hrs  = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);

  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  if (hrs < 24)  return `${hrs} 小时前`;
  if (days < 7)  return `${days} 天前`;

  return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
}

function stripMarkdown(md) {
  return md
    .replace(/#{1,6}\s/g, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/`{1,3}[^`]*`{1,3}/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[>\-*+|]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function simpleMarkdown(md) {
  if (!md) return '';
  let html = md
    // Escaped HTML
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Images
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:var(--radius-md)">')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    // Headings
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Horizontal rule
    .replace(/^---$/gm, '<hr>')
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Unordered list items
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // Ordered list items
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Wrap adjacent <li> in <ul>
    .replace(/((?:<li>.*<\/li>\n?)+)/g, (match) => {
      // If already inside a list, don't wrap; simple approach: wrap all
      return '<ul>' + match + '</ul>';
    })
    // Paragraphs: wrap remaining non-tag text lines
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');

  return '<p>' + html + '</p>';
}

/* ============================================
   RENDER
   ============================================ */
function renderAll() {
  renderSidebar();
  renderView();
  updateSearchInput();
}

function renderSidebar() {
  // Counts
  document.getElementById('countAll').textContent = data.articles.length;

  // Category list
  const catList = document.getElementById('categoryList');
  catList.innerHTML = data.categories.map(c => {
    const count = data.articles.filter(a => a.categoryId === c.id).length;
    return `
      <button class="nav-item${currentCategory === c.id ? ' active' : ''}" data-view="${c.id}" onclick="filterByCategory('${c.id}', this)">
        <span class="dot" style="background:${c.color}"></span> ${escHtml(c.name)}
        <span class="count">${count}</span>
      </button>
    `;
  }).join('');

  // Update hero stats
  document.getElementById('heroArticleCount').textContent = data.articles.length;
  document.getElementById('heroCategoryCount').textContent = data.categories.length;
  document.getElementById('heroTagCount').textContent = getAllTags().length;
}

function renderView() {
  const views = ['viewHero', 'viewList', 'viewDetail'];
  views.forEach(id => document.getElementById(id).classList.remove('active'));

  if (currentView === 'hero') {
    document.getElementById('viewHero').classList.add('active');
  } else if (currentView === 'list') {
    renderArticleList();
    document.getElementById('viewList').classList.add('active');
  } else if (currentView === 'detail') {
    renderArticleDetail();
    document.getElementById('viewDetail').classList.add('active');
  }

  // Reading progress bar only for detail view
  document.getElementById('readingProgress').style.display =
    currentView === 'detail' ? 'block' : 'none';
}

function renderArticleList() {
  const articles = searchArticles(searchQuery, tagFilter);
  const list = document.getElementById('articleList');
  const catName = currentCategory === 'all'
    ? '所有文章'
    : (getCategory(currentCategory)?.name || '文章');

  document.getElementById('listTitle').textContent = tagFilter
    ? `标签: ${tagFilter}`
    : searchQuery
      ? `搜索: "${searchQuery}"`
      : catName;

  document.getElementById('resultCount').textContent =
    articles.length === 0 ? '没有找到文章' : `共 ${articles.length} 篇`;

  if (articles.length === 0) {
    list.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--c-text-muted)">
        <div style="font-size:48px;margin-bottom:16px">📭</div>
        <p style="font-size:15px">${searchQuery ? '没有匹配的文章，试试其他关键词' : '这个分类下还没有文章'}</p>
        ${!searchQuery ? '<button class="btn btn-primary" style="margin-top:16px" onclick="openEditor()">+ 写一篇文章</button>' : ''}
      </div>
    `;
    return;
  }

  // Sort by updatedAt descending
  const sorted = [...articles].sort((a, b) =>
    new Date(b.updatedAt) - new Date(a.updatedAt)
  );

  list.innerHTML = sorted.map(a => {
    const cat = getCategory(a.categoryId);
    const catName = cat ? cat.name : '未分类';
    const catColor = getCategoryColor(a.categoryId);
    const stripped = stripMarkdown(a.content);
    const excerpt = stripped.slice(0, 120) + (stripped.length > 120 ? '…' : '');
    return `
      <article class="article-card" style="--card-accent:${catColor}" onclick="openArticle('${a.id}')">
        <div class="article-card-body">
          <div class="article-card-title">${escHtml(a.title)}</div>
          <div class="article-card-excerpt">${escHtml(excerpt)}</div>
          <div class="article-card-meta">
            <span class="article-card-category" style="color:${catColor};background:${catColor}15">${escHtml(catName)}</span>
            <span>${formatDate(a.updatedAt)}</span>
            ${a.tags.slice(0, 3).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
          </div>
        </div>
      </article>
    `;
  }).join('');

}

function renderArticleDetail() {
  const a = data.articles.find(a => a.id === currentArticleId);
  if (!a) {
    showToast('文章不存在', 'error');
    showListView();
    return;
  }

  const cat = getCategory(a.categoryId);
  const catName = cat ? cat.name : '未分类';
  const catColor = getCategoryColor(a.categoryId);

  document.getElementById('articleDetail').innerHTML = `
    <button class="detail-back" onclick="showListView()">
      ← 返回列表
    </button>
    <div class="detail-header">
      <div class="detail-category" style="color:${catColor}">${escHtml(catName)}</div>
      <h1 class="detail-title">${escHtml(a.title)}</h1>
      <div class="detail-meta">
        <span>📅 创建于 ${formatDate(a.createdAt)}</span>
        <span>✏️ 更新于 ${formatDate(a.updatedAt)}</span>
      </div>
      <div class="detail-tags">
        ${a.tags.map(t => `<span class="tag tag-clickable" style="cursor:pointer" data-tag="${escHtml(t)}" onclick="event.stopPropagation();filterByTag(this.dataset.tag)" title="查看所有标记为「${escHtml(t)}」的文章">${escHtml(t)}</span>`).join('')}
      </div>
    </div>
    <div class="detail-content">
      ${simpleMarkdown(a.content)}
    </div>
    <div class="detail-actions">
      <button class="btn btn-primary" onclick="openEditor('${a.id}')">✏️ 编辑</button>
      <button class="btn btn-danger" onclick="confirmDelete('${a.id}')">🗑 删除</button>
    </div>
  `;
}

function updateSearchInput() {
  document.getElementById('searchInput').value = searchQuery;
}

/* ============================================
   NAVIGATION
   ============================================ */
function filterByCategory(categoryId, btnEl) {
  currentCategory = categoryId;
  currentView = 'list';
  currentArticleId = null;
  searchQuery = '';
  tagFilter = '';
  document.getElementById('searchInput').placeholder = '搜索知识库...';

  // Update active states
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  else {
    const target = document.querySelector(`.nav-item[data-view="${categoryId}"]`);
    if (target) target.classList.add('active');
  }

  renderAll();
  closeMobileSidebar();
}

function filterByTag(tag) {
  searchQuery = '';
  tagFilter = tag;
  currentCategory = 'all';
  currentView = 'list';
  currentArticleId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const allBtn = document.querySelector('.nav-item[data-view="all"]');
  if (allBtn) allBtn.classList.add('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').placeholder = `标签: ${tag}`;
  const heroInput = document.getElementById('heroSearchInput');
  if (heroInput) { heroInput.value = ''; heroInput.placeholder = `标签: ${tag}`; }
  renderAll();
  closeMobileSidebar();
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value;
  tagFilter = '';
  document.getElementById('searchInput').placeholder = '搜索知识库...';
  // Keep hero search in sync
  const heroInput = document.getElementById('heroSearchInput');
  if (heroInput) { heroInput.value = searchQuery; heroInput.placeholder = '输入关键词开始搜索…'; }
  if (searchQuery.trim()) {
    currentView = 'list';
    renderView();
  } else if (currentView === 'list') {
    renderArticleList();
  }
}

function switchToSearch() {
  currentView = 'list';
  renderView();
  document.getElementById('searchInput').focus();
}

function syncSearchFromHero() {
  const heroVal = document.getElementById('heroSearchInput').value;
  document.getElementById('searchInput').value = heroVal;
  searchQuery = heroVal;
  if (searchQuery.trim()) {
    currentView = 'list';
    renderView();
  }
}

function openArticle(id) {
  currentArticleId = id;
  currentView = 'detail';
  renderAll();
  window.scrollTo(0, 0);
}

function showListView() {
  currentView = 'list';
  currentArticleId = null;
  renderAll();
}

function showHero() {
  currentView = 'hero';
  currentArticleId = null;
  currentCategory = 'all';
  searchQuery = '';
  tagFilter = '';
  document.getElementById('searchInput').placeholder = '搜索知识库...';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const allBtn = document.querySelector('.nav-item[data-view="all"]');
  if (allBtn) allBtn.classList.add('active');
  renderAll();
}

/* ============================================
   EDITOR
   ============================================ */
function openEditor(articleId) {
  editingArticleId = articleId || null;
  const modal = document.getElementById('editorModal');
  const titleEl = document.getElementById('editorTitle');
  const btnSave = document.getElementById('btnSave');

  // Populate category dropdown
  const select = document.getElementById('editorCategory');
  select.innerHTML = '<option value="">无分类</option>' +
    data.categories.map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('');

  if (articleId) {
    const a = data.articles.find(a => a.id === articleId);
    if (!a) return;
    titleEl.textContent = '编辑文章';
    btnSave.textContent = '更新';
    document.getElementById('editorArticleTitle').value = a.title;
    document.getElementById('editorCategory').value = a.categoryId || '';
    document.getElementById('editorTags').value = a.tags.join(', ');
    document.getElementById('editorContent').value = a.content;
  } else {
    titleEl.textContent = '新建文章';
    btnSave.textContent = '保存';
    document.getElementById('editorArticleTitle').value = '';
    document.getElementById('editorCategory').value = currentCategory !== 'all' ? currentCategory : '';
    document.getElementById('editorTags').value = '';
    document.getElementById('editorContent').value = '';
  }

  modal.classList.add('open');
  document.getElementById('editorArticleTitle').focus();
}

function closeEditor() {
  document.getElementById('editorModal').classList.remove('open');
  editingArticleId = null;
}

function saveArticle() {
  const title = document.getElementById('editorArticleTitle').value.trim();
  const categoryId = document.getElementById('editorCategory').value;
  const tagsStr = document.getElementById('editorTags').value;
  const content = document.getElementById('editorContent').value;

  if (!title) {
    showToast('请输入文章标题', 'warning');
    document.getElementById('editorArticleTitle').focus();
    return;
  }

  const tags = tagsStr
    .split(/[,，]/)
    .map(t => t.trim())
    .filter(Boolean);

  const now = new Date().toISOString();

  if (editingArticleId) {
    // Update
    const idx = data.articles.findIndex(a => a.id === editingArticleId);
    if (idx === -1) return;
    data.articles[idx] = {
      ...data.articles[idx],
      title,
      categoryId: categoryId || null,
      tags,
      content,
      updatedAt: now,
    };
    currentArticleId = editingArticleId;
    showToast('文章已更新', 'success');
  } else {
    // Create
    const newArticle = {
      id: 'a_' + Date.now(),
      title,
      categoryId: categoryId || null,
      tags,
      content,
      createdAt: now,
      updatedAt: now,
    };
    data.articles.unshift(newArticle);
    currentArticleId = newArticle.id;
    showToast('文章已创建', 'success');
  }

  persist();
  closeEditor();

  // If we came from a category view, stay there
  if (editingArticleId && currentView === 'detail') {
    currentView = 'detail';
  } else if (currentView === 'detail' && editingArticleId) {
    currentView = 'detail';
  } else {
    currentView = 'detail';
  }

  editingArticleId = null;
  renderAll();
}

function addNewCategory() {
  const name = prompt('输入新分类名称：');
  if (!name || !name.trim()) return;

  const exists = data.categories.find(c =>
    c.name.toLowerCase() === name.trim().toLowerCase()
  );
  if (exists) {
    showToast('该分类已存在', 'warning');
    return;
  }

  // Pick an unused color
  const usedColors = new Set(data.categories.map(c => c.color));
  const color = CATEGORY_COLORS.find(c => !usedColors.has(c)) || CATEGORY_COLORS[data.categories.length % CATEGORY_COLORS.length];

  const newCat = {
    id: 'cat_' + Date.now(),
    name: name.trim(),
    color,
  };
  data.categories.push(newCat);
  persist();

  // Refresh category dropdown
  const select = document.getElementById('editorCategory');
  const opt = document.createElement('option');
  opt.value = newCat.id;
  opt.textContent = newCat.name;
  select.appendChild(opt);
  select.value = newCat.id;

  renderSidebar();
  showToast(`分类「${name.trim()}」已创建`, 'success');
}

/* ============================================
   DELETE
   ============================================ */
function confirmDelete(articleId) {
  const a = data.articles.find(a => a.id === articleId);
  if (!a) return;

  document.getElementById('confirmTitle').textContent = '确认删除';
  document.getElementById('confirmMsg').textContent = `确定要删除「${a.title}」吗？此操作不可撤销。`;
  document.getElementById('confirmDialog').classList.add('open');

  confirmCallback = () => {
    data.articles = data.articles.filter(a => a.id !== articleId);
    persist();
    currentArticleId = null;
    showListView();
    renderAll();
    showToast('文章已删除', 'success');
  };
}

function closeConfirm() {
  document.getElementById('confirmDialog').classList.remove('open');
  confirmCallback = null;
}

// Bind confirm button
document.getElementById('btnConfirm').addEventListener('click', () => {
  if (confirmCallback) confirmCallback();
  closeConfirm();
});

/* ============================================
   TOAST
   ============================================ */
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✅', warning: '⚠️', error: '❌', info: 'ℹ️' };
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `${icons[type] || icons.info} ${message}`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('fadeout');
    toast.addEventListener('animationend', () => toast.remove());
  }, 2800);
}

/* ============================================
   SIDEBAR MOBILE
   ============================================ */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    closeMobileSidebar();
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('open');
  }
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);

/* ============================================
   READING PROGRESS
   ============================================ */
window.addEventListener('scroll', () => {
  if (currentView !== 'detail') return;
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? Math.min((scrollTop / docHeight) * 100, 100) : 0;
  document.getElementById('readingProgress').style.width = progress + '%';
});

/* ============================================
   KEYBOARD SHORTCUTS
   ============================================ */
document.addEventListener('keydown', (e) => {
  // Ctrl+K / Cmd+K → focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  // Escape → close modals or go back
  if (e.key === 'Escape') {
    if (document.getElementById('confirmDialog').classList.contains('open')) {
      closeConfirm();
    } else if (document.getElementById('editorModal').classList.contains('open')) {
      closeEditor();
    } else if (currentView === 'detail') {
      showListView();
    }
  }
  // Ctrl+N → new article
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault();
    openEditor();
  }
});

/* ============================================
   CLICK OUTSIDE MODAL
   ============================================ */
document.getElementById('editorModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditor();
});

/* ============================================
   INIT
   ============================================ */
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderAll();

// If no articles, show hero; otherwise show list
if (data.articles.length === 0) {
  showHero();
}

console.log('📚 Knowledge Base ready — %c%d articles%c across %c%d categories%c',
  'font-weight:600', data.articles.length, '',
  'font-weight:600', data.categories.length, '');
console.log('⌨️  Shortcuts: Ctrl+K search | Ctrl+N new article | Esc go back');
</script>
