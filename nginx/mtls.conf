# mTLS 反向代理 — TLS 终止 + 客户端证书请求（不验证链）
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:@SECLEVEL=0;

    # 请求客户端证书但不验证（应用层负责身份识别）
    ssl_verify_client optional_no_ca;
    ssl_verify_depth   5;

    # 上传限制：与后端 MAX_UPLOAD_BYTES (500MB) 对齐，超限由后端返回 413
    client_max_body_size 500m;
    # 大文件上传耗时长，放宽读超时（默认 60s 对 500MB 上传可能不够）
    proxy_read_timeout 300s;

    # 将客户端证书 PEM 传给后端
    location / {
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://my-wiki:8444;
    }
}
